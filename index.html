<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Goldline: auction house price charts for World of Warcraft Forever." />
    <meta name="theme-color" content="#11141b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Goldline</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Goldline">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5" />
          <path d="M7 21 L12.5 15 L16.5 18 L25 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-name">Goldline</span>
      </a>
      <div class="search" role="search">
        <input id="search" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" />
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>
      <div class="house">
        <label><span data-i18n="realm"></span>
          <select id="realm"></select>
        </label>
        <label><span data-i18n="faction"></span>
          <select id="faction">
            <option value="horde" data-i18n="horde"></option>
            <option value="alliance" data-i18n="alliance"></option>
          </select>
        </label>
      </div>
      <button id="lang" class="lang" type="button"></button>
    </header>

    <p id="sample-banner" class="banner" data-i18n="sampleBanner" hidden></p>

    <main class="layout">
      <section class="item" aria-live="polite">
        <div class="item-head">
          <button id="star" class="star" type="button" aria-pressed="false">★</button>
          <div class="item-title">
            <h1 id="item-name"></h1>
            <p id="item-category" class="muted"></p>
          </div>
          <div class="item-price">
            <div id="price" class="price"></div>
            <div id="change" class="change"></div>
          </div>
        </div>

        <div class="toolbar">
          <div class="group" role="radiogroup" id="timeframes" data-label="timeframe"></div>
          <div class="group" role="radiogroup" id="chart-types" data-label="chartType"></div>
          <div class="group" id="indicator-toggles" data-label="indicators"></div>
        </div>

        <div class="chart-wrap">
          <div id="legend" class="legend"></div>
          <div id="chart" class="chart"></div>
        </div>

        <dl class="stats" id="stats"></dl>
        <p class="footnote muted" data-i18n="listedNote"></p>
      </section>

      <aside class="watchlist">
        <h2 data-i18n="watchlist"></h2>
        <ul id="watchlist"></ul>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
