<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <title>WoW Forever AH — Horde PvP Terminal</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.3.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #131a2a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --up: #10b981;
      --down: #ef4444;
      --gold: #fbbf24;
      --silver: #cbd5e1;
      --copper: #d97706;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    header { padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .ticker-select { background: #1e293b; color: var(--text); border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; font-size: 15px; font-weight: 600; }
    .price-badge { text-align: right; font-size: 13px; }
    .g { color: var(--gold); font-weight: 700; }
    .s { color: var(--silver); font-weight: 600; }
    .c { color: var(--copper); font-weight: 600; }
    .toolbar { display: flex; gap: 8px; padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .chip { background: var(--panel); color: var(--muted); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .chip.active { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border-color: var(--accent); }
    #chart-container { flex: 1; width: 100%; position: relative; min-height: 260px; }
    .legend { position: absolute; top: 10px; left: 12px; z-index: 10; font-size: 12px; pointer-events: none; background: rgba(11, 15, 25, 0.78); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); }
    .bottom-sheet { height: 38%; background: var(--panel); border-top: 1px solid var(--border); overflow-y: auto; padding: 10px 14px; }
    .sheet-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: 11px; }
    td { padding: 8px 4px; border-bottom: 1px solid rgba(30, 41, 59, 0.6); }
    .pos { color: var(--up); font-weight: 600; }
    .neg { color: var(--down); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <select id="itemSelect" class="ticker-select">
      <option value="90002">Azerothium Bar (Mining)</option>
      <option value="90001">Pitchblende (Scarce Ore)</option>
      <option value="13938">Mightfish Steak (+40 AP)</option>
      <option value="13935">Baked Salmon (+28 SP)</option>
      <option value="2592">Wool Cloth (First Aid)</option>
      <option value="12363">Arcane Crystal</option>
    </select>
    <div class="price-badge">
      <div id="livePrice">--</div>
      <div id="liveChange" style="font-size:11px; color:var(--muted);">US PvP — Horde (House 113)</div>
    </div>
  </header>

  <div class="toolbar">
    <button class="chip active" id="btnSma" onclick="toggleSeries('sma')">20H SMA</button>
    <button class="chip active" id="btnCost" onclick="toggleSeries('cost')">Crafting Cost Floor</button>
    <button class="chip" onclick="chart.timeScale().fitContent()">Reset Zoom</button>
  </div>

  <div id="chart-container">
    <div class="legend" id="chartLegend">Tap or drag crosshair to inspect OHLCV</div>
  </div>

  <div class="bottom-sheet">
    <div class="sheet-title">
      <span>Live Horde Crafting Margins (After 5% AH Cut)</span>
      <span>Master Chef 1.5x Active</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Recipe</th>
          <th>Craft Cost</th>
          <th>AH Net</th>
          <th>Profit</th>
          <th>ROI</th>
        </tr>
      </thead>
      <tbody id="marginRows"></tbody>
    </table>
  </div>

  <script>
    function formatGSC(copper) {
      if (copper === null || copper === undefined) return "--";
      const val = Math.round(Math.abs(copper));
      const g = Math.floor(val / 10000);
      const s = Math.floor((val % 10000) / 100);
      const c = val % 100;
      const parts = [];
      if (g > 0) parts.push(`${g}g`);
      if (s > 0 || g > 0) parts.push(`${s}s`);
      parts.push(`${c}c`);
      return (copper < 0 ? "-" : "") + parts.join(" ");
    }

    function formatGSCStyled(copper) {
      const val = Math.round(Math.abs(copper));
      const g = Math.floor(val / 10000);
      const s = Math.floor((val % 10000) / 100);
      const c = val % 100;
      let html = copper < 0 ? "-" : "";
      if (g > 0) html += `<span class="g">${g}g</span> `;
      if (s > 0 || g > 0) html += `<span class="s">${s}s</span> `;
      html += `<span class="c">${c}c</span>`;
      return html;
    }

    const container = document.getElementById("chart-container");
    const chart = LightweightCharts.createChart(container, {
      autoSize: true,
      layout: { background: { color: "#0b0f19" }, textColor: "#94a3b8" },
      grid: { vertLines: { color: "#131a2a" }, horzLines: { color: "#131a2a" } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      localization: { priceFormatter: formatGSC },
      timeScale: { timeVisible: true, secondsVisible: false, borderColor: "#1e293b" },
      rightPriceScale: { borderColor: "#1e293b" }
    });

    const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: "#10b981", downColor: "#ef4444",
      borderUpColor: "#10b981", borderDownColor: "#ef4444",
      wickUpColor: "#10b981", wickDownColor: "#ef4444"
    });

    const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: "volume" },
      priceScaleId: ""
    });
    volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

    const smaSeries = chart.addSeries(LightweightCharts.LineSeries, {
      color: "#3b82f6", lineWidth: 2, title: "20H SMA"
    });

    const costSeries = chart.addSeries(LightweightCharts.LineSeries, {
      color: "#f59e0b", lineWidth: 2, lineStyle: 2, title: "Craft Cost"
    });

    async function loadItem(itemId) {
      try {
        const res = await fetch(`/api/candles/${itemId}`);
        if (res.ok) {
          const rows = await res.json();
          if (rows.length > 0) {
            const candles = rows.map(r => ({
              time: Number(r.time), open: Number(r.open), high: Number(r.high), low: Number(r.low), close: Number(r.close)
            }));
            const vols = rows.map(r => ({
              time: Number(r.time), value: Number(r.volume),
              color: Number(r.close) >= Number(r.open) ? "rgba(16,185,129,0.35)" : "rgba(239,68,68,0.35)"
            }));
            const smas = candles.map((c, i) => {
              const slice = candles.slice(Math.max(0, i - 19), i + 1);
              const avg = Math.round(slice.reduce((s, x) => s + x.close, 0) / slice.length);
              return { time: c.time, value: avg };
            });
            candleSeries.setData(candles);
            volumeSeries.setData(vols);
            smaSeries.setData(smas);
            const last = candles[candles.length - 1];
            document.getElementById("livePrice").innerHTML = formatGSCStyled(last.close);
            chart.timeScale().fitContent();
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadMargins() {
      try {
        const res = await fetch("/api/margins");
        if (res.ok) {
          const rows = await res.json();
          const tbody = document.getElementById("marginRows");
          tbody.innerHTML = rows.map(m => `
            <tr>
              <td><b>${m.recipe_name}</b></td>
              <td>${formatGSCStyled(m.total_craft_cost_copper)}</td>
              <td>${formatGSCStyled(m.net_revenue_after_ah_cut_copper)}</td>
              <td class="${m.net_profit_copper >= 0 ? 'pos' : 'neg'}">${m.net_profit_copper >= 0 ? '+' : ''}${formatGSCStyled(m.net_profit_copper)}</td>
              <td class="${m.roi_pct >= 0 ? 'pos' : 'neg'}">${m.roi_pct >= 0 ? '+' : ''}${m.roi_pct}%</td>
            </tr>
          `).join("");
        }
      } catch (e) {
        console.error(e);
      }
    }

    chart.subscribeCrosshairMove(param => {
      if (!param.time) return;
      const d = param.seriesData.get(candleSeries);
      if (d) {
        document.getElementById("chartLegend").innerHTML =
          `O: ${formatGSC(d.open)} | H: ${formatGSC(d.high)} | L: ${formatGSC(d.low)} | C: <b>${formatGSC(d.close)}</b>`;
      }
    });

    const visibility = { sma: true, cost: true };
    function toggleSeries(type) {
      visibility[type] = !visibility[type];
      if (type === "sma") {
        smaSeries.applyOptions({ visible: visibility.sma });
        document.getElementById("btnSma").classList.toggle("active", visibility.sma);
      } else {
        costSeries.applyOptions({ visible: visibility.cost });
        document.getElementById("btnCost").classList.toggle("active", visibility.cost);
      }
    }

    document.getElementById("itemSelect").addEventListener("change", e => loadItem(e.target.value));
    loadItem("90002");
    loadMargins();
  </script>
</body>
</html>
