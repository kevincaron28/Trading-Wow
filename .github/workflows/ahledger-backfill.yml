name: AHledger backfill

# Daily price history since WoW Forever's launch from AHledger's public API (used with AHledger's permission, owner,
# 19 Nov 2026; docs/DATA.md). Each run resumes from the cache on the `ahledger-state` branch, fetches for up to 50
# minutes (150 requests a minute, honouring 429/503 Retry-After), saves the cache, then publishes ext/ahledger, the
# merged early history and the indexes to the `data` branch with a lease. Once everything is fetched (`done.json`),
# the backfill stops; the early history is then fixed (Goldline's own collector covers every day since 18 Nov).

on:
  schedule:
    - cron: "25 * * * *"
    - cron: "55 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: ahledger-backfill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Git identity
        run: |
          git config --global user.name "goldline-backfill"
          git config --global user.email "goldline-backfill@users.noreply.github.com"
      - name: Progress (ahledger-state branch)
        id: state
        run: |
          git fetch -q origin ahledger-state
          git worktree add -q state FETCH_HEAD
          if [ -f state/done.json ]; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - name: Fetch (up to 50 minutes)
        if: steps.state.outputs.done == 'false'
        env:
          AHLEDGER_API_KEY: ${{ secrets.AHLEDGER_API_KEY }}
          AHLEDGER_API_KEY_2: ${{ secrets.AHLEDGER_API_KEY_2 }}
          AHLEDGER_API_KEY_3: ${{ secrets.AHLEDGER_API_KEY_3 }}
        run: node collector/backfill-ahledger.ts fetch state --minutes 50
      - name: Save progress
        if: always() && steps.state.outputs.done == 'false'
        run: |
          cd state
          git add -A
          if git diff --cached --quiet; then echo "no progress to save"; exit 0; fi
          git commit -q --amend -m "AHledger backfill state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin HEAD:ahledger-state
      - name: Data branch
        if: steps.state.outputs.done == 'false'
        run: |
          git fetch -q --depth 1 origin data
          git worktree add -q data-branch FETCH_HEAD
          cd data-branch && git switch -q -c data-local
      - name: Publish
        if: steps.state.outputs.done == 'false'
        run: bash collector/publish-ahledger.sh data-branch state
