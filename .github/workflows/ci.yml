name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The collector runs in plain Node (no bundler): every import needs its .ts extension. Vitest would not notice.
      - name: Collector modules load in Node
        run: node --input-type=module -e 'for (const m of ["./collector/store.ts", "./collector/indexes.ts", "./collector/coverage.ts", "./collector/audit-catalog.ts", "./collector/import-auctionator.ts", "./collector/merge-history.ts", "./collector/weekly.ts", "./collector/recaps.ts", "./collector/discord-recap.ts", "./collector/recap-ai.ts", "./collector/r2-publish.ts"]) await import(m)'
      - run: npx vite build
