name: Android APK

# Builds the Goblin Ledger Android app (Capacitor wrapper around the web build).
# - Manual run (Actions tab > Android APK > Run workflow): APK and Play bundle attached to the run as artifacts.
# - Pushing a tag v*: also publishes a GitHub release with goldline.apk and the Play bundle, so
#   https://github.com/kevincaron28/Trading-Wow/releases/latest/download/goldline.apk always points at the newest one.
# Signing: with the GOLDLINE_KEYSTORE_BASE64 and GOLDLINE_KEYSTORE_PASSWORD secrets set, a release-signed APK and the
# Play bundle (goblin-ledger-<version>.aab, signed with the upload key; Play App Signing re-signs it for users);
# without them, a debug-signed APK only (installs fine, but a later release-signed version needs an uninstall first).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.GOLDLINE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Version
        run: |
          echo "GOLDLINE_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          # Same code as the Play bundle: major*10000 + minor*100 + patch (0.6.0 -> 600), so APK installs update in place.
          echo "GOLDLINE_VERSION_CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number);a*10000+b*100+c")" >> "$GITHUB_ENV"

      - name: Build release APK (signed)
        if: env.HAS_KEY == 'true'
        env:
          GOLDLINE_KEYSTORE_PASSWORD: ${{ secrets.GOLDLINE_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.GOLDLINE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/goldline.p12"
          export GOLDLINE_KEYSTORE="$RUNNER_TEMP/goldline.p12"
          cd android && ./gradlew --no-daemon assembleSideloadRelease
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk "$GITHUB_WORKSPACE/goldline.apk"

      # The Google Play bundle (the "play" flavour: Play's in-app updates, no APK installs), same version code as the APK.
      # It used to be built by hand on the owner's PC (docs/PLAY_STORE.md); upload it in Play Console as before.
      - name: Build Play bundle (signed with the upload key)
        if: env.HAS_KEY == 'true'
        env:
          GOLDLINE_KEYSTORE_PASSWORD: ${{ secrets.GOLDLINE_KEYSTORE_PASSWORD }}
        run: |
          export GOLDLINE_KEYSTORE="$RUNNER_TEMP/goldline.p12"
          cd android && ./gradlew --no-daemon bundlePlayRelease
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$GITHUB_WORKSPACE/goblin-ledger-${GOLDLINE_VERSION_NAME}.aab"
          # The certificate the bundle is signed with (public): its SHA-256 must match Play Console > App integrity >
          # Upload key certificate, or Play refuses the upload.
          keytool -printcert -jarfile "$GITHUB_WORKSPACE/goblin-ledger-${GOLDLINE_VERSION_NAME}.aab" | grep -E "Owner|SHA256:" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Play bundle: goblin-ledger-${GOLDLINE_VERSION_NAME}.aab, version code ${GOLDLINE_VERSION_CODE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/goldline.p12"

      - name: Build debug-signed APK (no release key configured)
        if: env.HAS_KEY != 'true'
        run: |
          cd android && ./gradlew --no-daemon assembleSideloadDebug
          cp app/build/outputs/apk/sideload/debug/app-sideload-debug.apk "$GITHUB_WORKSPACE/goldline.apk"

      - run: cp goldline.apk "goldline-${GOLDLINE_VERSION_NAME}.apk"

      # Over-the-air update files (src/app/updates.ts): the web bundle and update.json, which says which bundle and APK
      # are current. minNativeBuild (package.json "goldline") is the version code of the last release with native changes.
      - name: Web bundle and update.json
        run: |
          (cd dist && zip -qr "$GITHUB_WORKSPACE/web-bundle.zip" .)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const pkg = require("./package.json");
            const sha = (f) => crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
            fs.writeFileSync("update.json", JSON.stringify({
              version: pkg.version,
              versionCode: Number(process.env.GOLDLINE_VERSION_CODE),
              minNativeBuild: pkg.goldline.minNativeBuild,
              bundleUrl: process.argv[1] + "/web-bundle.zip",
              bundleSha256: sha("web-bundle.zip"),
              apkUrl: process.argv[1] + "/goldline.apk",
              apkSha256: sha("goldline.apk"),
            }, null, 2));
          ' "$BASE"
          cat update.json

      - uses: actions/upload-artifact@v4
        with:
          name: goldline-apk
          path: goldline*.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: goblin-ledger-play-bundle
          path: goblin-ledger-*.aab
          if-no-files-found: error

      - name: Publish release
        # Without the release key, releases are published from a locally signed build instead (README > Android app).
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" goldline.apk "goldline-${GOLDLINE_VERSION_NAME}.apk" "goblin-ledger-${GOLDLINE_VERSION_NAME}.aab" web-bundle.zip update.json \
            --title "Goblin Ledger ${GOLDLINE_VERSION_NAME} for Android" \
            --notes "Goblin Ledger for Android: live WoW Forever auction house prices, refreshed about every hour. On your phone, open the download link, allow installs from your browser when asked, then open goldline.apk. The .aab file is the Google Play bundle (for Play Console, not for phones)."
