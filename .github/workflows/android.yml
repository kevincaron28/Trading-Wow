name: Android APK

# Builds the Goblin Ledger Android app (Capacitor wrapper around the web build).
# - Manual run (Actions tab > Android APK > Run workflow): APK attached to the run as an artifact.
# - Pushing a tag v*: also publishes a GitHub release with goldline.apk, so
#   https://github.com/kevincaron28/Trading-Wow/releases/latest/download/goldline.apk always points at the newest one.
# Signing: with the GOLDLINE_KEYSTORE_BASE64 and GOLDLINE_KEYSTORE_PASSWORD secrets set, a release-signed APK;
# without them, a debug-signed APK (installs fine, but a later release-signed version needs an uninstall first).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.GOLDLINE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Version
        run: |
          echo "GOLDLINE_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          # Same code as the Play bundle: major*10000 + minor*100 + patch (0.6.0 -> 600), so APK installs update in place.
          echo "GOLDLINE_VERSION_CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number);a*10000+b*100+c")" >> "$GITHUB_ENV"

      - name: Build release APK (signed)
        if: env.HAS_KEY == 'true'
        env:
          GOLDLINE_KEYSTORE_PASSWORD: ${{ secrets.GOLDLINE_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.GOLDLINE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/goldline.p12"
          export GOLDLINE_KEYSTORE="$RUNNER_TEMP/goldline.p12"
          cd android && ./gradlew --no-daemon assembleSideloadRelease
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk "$GITHUB_WORKSPACE/goldline.apk"

      - name: Build debug-signed APK (no release key configured)
        if: env.HAS_KEY != 'true'
        run: |
          cd android && ./gradlew --no-daemon assembleSideloadDebug
          cp app/build/outputs/apk/sideload/debug/app-sideload-debug.apk "$GITHUB_WORKSPACE/goldline.apk"

      - run: cp goldline.apk "goldline-${GOLDLINE_VERSION_NAME}.apk"

      # Over-the-air update files (src/app/updates.ts): the web bundle and update.json, which says which bundle and APK
      # are current. minNativeBuild (package.json "goldline") is the version code of the last release with native changes.
      - name: Web bundle and update.json
        run: |
          (cd dist && zip -qr "$GITHUB_WORKSPACE/web-bundle.zip" .)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const pkg = require("./package.json");
            const sha = (f) => crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
            fs.writeFileSync("update.json", JSON.stringify({
              version: pkg.version,
              versionCode: Number(process.env.GOLDLINE_VERSION_CODE),
              minNativeBuild: pkg.goldline.minNativeBuild,
              bundleUrl: process.argv[1] + "/web-bundle.zip",
              bundleSha256: sha("web-bundle.zip"),
              apkUrl: process.argv[1] + "/goldline.apk",
              apkSha256: sha("goldline.apk"),
            }, null, 2));
          ' "$BASE"
          cat update.json

      - uses: actions/upload-artifact@v4
        with:
          name: goldline-apk
          path: goldline*.apk

      - name: Publish release
        # Without the release key, releases are published from a locally signed build instead (README > Android app).
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" goldline.apk "goldline-${GOLDLINE_VERSION_NAME}.apk" web-bundle.zip update.json \
            --title "Goblin Ledger ${GOLDLINE_VERSION_NAME} for Android" \
            --notes "Goblin Ledger for Android: live WoW Forever auction house prices, refreshed about every hour. On your phone, open the download link, allow installs from your browser when asked, then open goldline.apk."
