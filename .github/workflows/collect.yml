name: Collect prices

# Hourly: fetch every WoW Forever auction house from Blizzard and publish the price files to the `data` branch.
# Needs two repository secrets: BNET_CLIENT_ID and BNET_CLIENT_SECRET (the "Goldline Forever" Battle.net client).
# Without them the job only prints a notice.

on:
  schedule:
    # GitHub stopped firing scheduled runs on this repo for hours at a time (19 Nov), so each run now collects four
    # times, 15 minutes apart, and then starts the next run itself (relay, below). These slots only restart the relay if
    # it ever breaks; the collector-watchdog workflow also starts a run when the data is more than 75 minutes old.
    # An already stored snapshot is skipped, so an extra collection costs a few seconds.
    - cron: "5 * * * *"
    - cron: "20 * * * *"
    - cron: "35 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
      BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$BNET_CLIENT_ID" ] || [ -z "$BNET_CLIENT_SECRET" ]; then
            echo "::notice::BNET_CLIENT_ID / BNET_CLIENT_SECRET are not set; skipping. See README > Live data."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
        with:
          ref: main
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
        with:
          ref: data
          path: data-branch
      # The previous snapshot's auction IDs (for estimated sales) are kept between runs, never published.
      - uses: actions/cache@v4
        if: steps.check.outputs.ok == 'true'
        with:
          path: data-branch/state
          key: collect-state-${{ github.run_id }}
          restore-keys: collect-state-
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 24
      - name: Collect and publish
        if: steps.check.outputs.ok == 'true'
        run: |
          git -C data-branch config user.name "goldline-collector"
          git -C data-branch config user.email "goldline-collector@users.noreply.github.com"
          # Four collections 15 minutes apart (about 50 minutes); a failed one does not stop the next.
          for i in 1 2 3 4; do
            bash collector/publish.sh data-branch || echo "::warning::collection $i failed"
            if [ "$i" -lt 4 ]; then sleep 900; fi
          done
      - name: Relay (start the next run)
        if: always() && steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          queued=$(gh run list -R "$GITHUB_REPOSITORY" -w collect.yml --status queued --json databaseId -q length || echo 0)
          if [ "$queued" = "0" ]; then gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main && echo "next run started"; else echo "a run is already queued"; fi
