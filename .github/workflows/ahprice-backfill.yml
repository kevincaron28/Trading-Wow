name: ahprice.com backfill

# Daily price history since WoW Forever's launch from ahprice.com's public API (used with the site's permission,
# owner, 18 Nov 2026; docs/DATA.md). Each run resumes from the progress kept on the `backfill-state` branch, fetches
# for up to 50 minutes (one request every 7 s, at most 1,900 a UTC day across all runs, backing off on errors), saves
# the progress, then publishes ext/ahprice and audit/coverage.json to the `data` branch with a lease (safe next to the
# hourly collector). Once every item is fetched (`done.json` on the state branch) nothing runs. No secrets: public API.
#
# GitHub sometimes skips scheduled runs, so several triggers start it: two hourly slots, and every finished collector
# run (that workflow fires reliably). A quick `check` job decides whether the backfill is behind; only then does the
# `backfill` job start (one at a time), so extra triggers cost a few seconds and never queue duplicate work.

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_run:
    workflows: ["Collect prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Is the backfill behind?
        id: decide
        env:
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          git init -q s && cd s
          git fetch -q --depth 1 "https://github.com/$REPO.git" backfill-state
          if git cat-file -e FETCH_HEAD:done.json 2>/dev/null; then
            echo "::notice::Backfill finished; nothing to do."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(date -u +%F)
          budget=$(git show FETCH_HEAD:budget.json 2>/dev/null || echo '{}')
          used=$(node -e 'const b=JSON.parse(process.argv[1]);console.log(b.day===process.argv[2]?b.used:0)' "$budget" "$today")
          age=$(( $(date -u +%s) - $(git log -1 --format=%ct FETCH_HEAD) ))
          echo "used today: $used / 1900; last progress saved ${age}s ago; event: $EVENT"
          if [ "$used" -ge 1900 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$age" -ge 2700 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  backfill:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    concurrency:
      group: ahprice-backfill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Git identity
        run: |
          git config --global user.name "goldline-backfill"
          git config --global user.email "goldline-backfill@users.noreply.github.com"
      - name: Progress (backfill-state branch)
        id: state
        run: |
          git fetch -q origin backfill-state
          git worktree add -q state FETCH_HEAD
          if [ -f state/done.json ]; then
            echo "::notice::Backfill finished ($(cat state/done.json)); nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Data branch
        if: steps.state.outputs.done == 'false'
        run: |
          git fetch -q --depth 1 origin data
          git worktree add -q data-branch FETCH_HEAD
          cd data-branch && git switch -q -c data-local
      - name: Fetch (up to 50 minutes)
        if: steps.state.outputs.done == 'false'
        run: node collector/backfill-ahprice.ts fetch state data-branch --minutes 50
      - name: Save progress
        if: always() && steps.state.outputs.done == 'false'
        run: |
          cd state
          git add -A
          if git diff --cached --quiet; then echo "no progress to save"; exit 0; fi
          git commit -q --amend -m "ahprice.com backfill state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin HEAD:backfill-state
      - name: Publish
        if: steps.state.outputs.done == 'false'
        run: bash collector/publish-ext.sh data-branch state
